# Tenant namespaces: namespaces that a user other than the cluster admin deploys into, with a
# client certificate that reaches nothing else (README, "Tenant namespaces"). Apply with
#   docker compose exec k3s kubectl apply -k /opt/arc-on-nas/manifests/tenants
# Separate from ../kustomization.yaml: the runners do not need it, and removing it is
# `kubectl delete -k` of this directory alone.
#
# Each tenant is a directory: its namespace, quota and limits, plus base/ (the Role, the
# RoleBinding, the NetworkPolicies) with its namespace set by kustomize. admission.yaml holds the
# two checks Pod Security "baseline" does not make, for every namespace labelled as a tenant.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admission.yaml
  - zuul-trial
  - build-farm
