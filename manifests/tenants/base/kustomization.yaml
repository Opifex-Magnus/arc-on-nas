# What every tenant namespace gets. The tenant's own kustomization.yaml sets the namespace. The
# RoleBinding comes last (../kustomization.yaml applies in this order).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - networkpolicy.yaml
  - quota-priority.yaml
  - role.yaml
  - rolebinding.yaml
