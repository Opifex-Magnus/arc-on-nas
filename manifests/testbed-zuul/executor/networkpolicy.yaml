# The executor's network. In: only zuul-web, from zuul, to the finger port 7900, from which it
# streams a running build's log. Out: as a tenant's pods (arc-on-nas's
# tenants/base/networkpolicy.yaml, egress-not-host, which ../check.sh keeps the same as this):
# ZooKeeper in zuul, the build nodes, and the internet through the proxy; not the host, the node's
# own ports or anything else on the stack network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finger-from-web
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuul
          podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 7900
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-not-host
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 172.31.250.0/24
              - 10.42.0.0/32
              - 10.42.0.1/32
    - to:
        # The proxy's fixed address on the stack network (arc-on-nas's docker-compose.yml).
        - ipBlock:
            cidr: 172.31.250.2/32
      ports:
        - protocol: TCP
          port: 3128
