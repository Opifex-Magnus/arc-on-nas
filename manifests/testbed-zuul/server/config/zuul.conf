# Zuul's configuration (https://zuul-ci.org/docs/zuul/latest/configuration.html), the same file for
# every Zuul service: the scheduler, web and launcher in zuul (deploy/zuul/server/), and the executor in
# zuul-executor (deploy/zuul/executor/). Each reads only its own sections and the shared ones.
#
# No secrets here. %(ZUUL_...)s is read from the service's environment, which takes it from a
# Secret (deploy/zuul/secrets.sh); Zuul offers only variables whose names start with ZUUL_.

[zookeeper]
# One ZooKeeper, over TLS with a client certificate (deploy/zuul/README.md, "ZooKeeper").
hosts=zookeeper.zuul.svc.cluster.local:2281
tls_cert=/etc/zuul-tls/tls.crt
tls_key=/etc/zuul-tls/tls.key
tls_ca=/etc/zuul-tls/ca.crt

[keystore]
# Encrypts the project keys Zuul keeps in ZooKeeper. Losing it loses the keys, and with them
# every secret encrypted for a project (deploy/zuul/README.md, "What persists").
password=%(ZUUL_KEYSTORE_PASSWORD)s

[database]
dburi=mariadb+pymysql://zuul:%(ZUUL_DB_PASSWORD)s@db.zuul.svc.cluster.local/zuul

[scheduler]
tenant_config=/etc/zuul/main.yaml
prometheus_port=9091

[web]
listen_address=0.0.0.0
port=9000
# Where report links point. The in-cluster address until zuul-web has a route of its own.
root=http://web.zuul.svc.cluster.local:9000/
prometheus_port=9091

[executor]
# The name zuul-web reaches the executor by for a running build's log: its pod's DNS name in the
# StatefulSet's headless Service (zuul-executor/executor.yaml).
hostname=%(ZUUL_EXECUTOR_HOSTNAME)s
state_dir=/var/lib/zuul
# The executor also merges: there is no separate merger (deploy/zuul/README.md, "How many of each").
merge_jobs=true
# On SIGTERM, take no new builds and finish the running ones, within the pod's grace period.
sigterm_method=graceful
prometheus_port=9091

[merger]
# The author of the merge commits Zuul makes to test a change on top of its branch; they are
# never pushed.
git_user_name=Zuul
git_user_email=zuul@zuul.invalid

[launcher]
prometheus_port=9091

[connection "opendev.org"]
# Zuul's own job library, public, read over HTTPS. The forge's connection comes with the gate's.
driver=git
baseurl=https://opendev.org
