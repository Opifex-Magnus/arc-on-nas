# ZooKeeper's configuration (zookeeper.yaml), one server on its own: Zuul's coordination and state
# (README.md, "ZooKeeper"). A client connects over TLS with a certificate from Zuul's CA, and
# on no other port: there is no clientPort, no admin server and no four-letter-word command.
dataDir=/data
tickTime=2000
initLimit=5
syncLimit=2
# Keep the last three snapshots and their logs, cleaned every hour, so the volume does not fill.
autopurge.snapRetainCount=3
autopurge.purgeInterval=1
maxClientCnxns=100
standaloneEnabled=true
admin.enableServer=false
4lw.commands.whitelist=
serverCnxnFactory=org.apache.zookeeper.server.NettyServerCnxnFactory
secureClientPort=2281
# PEM files, named as they are: ZooKeeper guesses a store's type only from a .pem, .jks or .p12
# name.
ssl.keyStore.location=/tls/keystore.pem
ssl.keyStore.type=PEM
ssl.trustStore.location=/tls/ca.crt
ssl.trustStore.type=PEM
ssl.clientAuth=need
