name: CI

# lint   every static check (scripts/lint.sh, with the tool versions in mise.toml).
# host   scripts/preflight.sh and scripts/trial.sh on a GitHub-hosted runner.
# zfs    the node with its kubelet and containerd directories on ZFS datasets, local storage
#        isolation on: it starts, measures both at their quotas, and evicts a tenant's pod that
#        writes past its ephemeral-storage limit.
# smoke  the real stack on a GitHub-hosted runner: docker compose up, the node Ready, the
#        manifests applied, the credential Secret created by scripts/register.sh, the controller
#        chart installed through the proxy and running, the runner pod templates admitted by Pod
#        Security "restricted", the egress rules tested from a pod, and the tenant namespaces: their
#        permissions, admission's refusals and NET_RAW drops, the ephemeral-storage limits and an
#        eviction for passing one, tenant-cert.sh's refusals and a
#        certificate it signs used by kubectl with the kubeconfig it writes through
#        api-forward.yml, the tenant NetworkPolicies against each target, with controls, and the
#        build farm's server: applied by the tenant with a key pair from scripts/farm-tls.sh, a
#        cache write and read through its frontend over TLS (no plain text, no client's action
#        result), a restart of its storage pod that keeps them, and its network: the frontend
#        reached from a runner pod and through farm-forward.yml, refused to the other tenant,
#        another namespace, the host and another address on the stack network, at the NodePort
#        and at the forwarder's addresses, and a renewed certificate served without a restart.
#
# What a hosted runner cannot show (README, "Status"): a scale set registering with GitHub and
# running a job (that needs a real credential and a repository to register with), the runner
# images (built by images.yml), the cache under a real build, and anything about your host's
# storage, kernel or sizing.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: scripts/lint.sh
        run: mise exec -- scripts/lint.sh

  host:
    name: Preflight and trial
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/preflight.sh
        run: scripts/preflight.sh
      - name: scripts/trial.sh
        run: scripts/trial.sh --timeout 240

  zfs:
    name: The node on ZFS
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Above the waits below (about 12 minutes); a normal run takes about 3 minutes.
    timeout-minutes: 20
    env:
      BUSYBOX_IMAGE: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The node's kubelet and containerd directories on ZFS datasets with quotas and compression,
      # bind-mounted as README "Requirements" suggests, and local storage isolation on.
      - name: A ZFS pool, and the node's directories on it
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q zfsutils-linux > /dev/null
          sudo modprobe zfs
          sudo zfs version
          truncate -s 8G "$RUNNER_TEMP/pool.img"
          sudo zpool create -m none -O compression=lz4 -O atime=off ci "$RUNNER_TEMP/pool.img"
          sudo zfs create -o quota=3G -o mountpoint=/mnt/ci-node/kubelet ci/kubelet
          sudo zfs create -o quota=4G -o mountpoint=/mnt/ci-node/agent ci/agent
          sudo zfs list -o name,quota,mountpoint
          sudo install -d -o 1001 -g 1001 -m 750 "$RUNNER_TEMP/ci-cache/default"
          sudo install -d -o 0 -g 0 -m 700 kubeconfig
          cpus=$(nproc)
          mem=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) / 1024 ))
          cat > .env <<EOF
          CACHE_DIR=$RUNNER_TEMP/ci-cache
          K3S_CPUS=$cpus
          K3S_MEMORY=4g
          K3S_CPU_SHARES=256
          K3S_PIDS_LIMIT=32768
          K3S_SYSTEM_RESERVED=cpu=$(( cpus * 1000 - 1500 - 250 ))m,memory=$(( mem - 2560 - 512 ))Mi
          K3S_KUBE_RESERVED=cpu=250m,memory=512Mi
          K3S_SNAPSHOTTER=overlayfs
          K3S_EXTRA_ARGS=
          EOF
          cat > docker-compose.override.yml <<EOF
          services:
            k3s:
              volumes:
                - /mnt/ci-node/agent:/var/lib/rancher/k3s/agent
                - /mnt/ci-node/kubelet:/var/lib/kubelet
          EOF
          docker compose config --quiet

      - name: The node is Ready and measures both datasets
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          docker compose up -d --wait --wait-timeout 180
          for _ in $(seq 1 30); do k get node ci-node >/dev/null 2>&1 && break; sleep 2; done
          k wait --for=condition=Ready node/ci-node --timeout=180s
          if docker compose exec -T k3s test -e /dev/zfs; then echo "the node has /dev/zfs" >&2; exit 1; fi
          fmt='{.status.capacity.ephemeral-storage} capacity, {.status.allocatable.ephemeral-storage} allocatable'
          echo "node ephemeral-storage: $(k get node ci-node -o jsonpath="$fmt")"
          # The kubelet's filesystem is the kubelet dataset, at its quota; the image filesystem the other.
          got=$(k get --raw /api/v1/nodes/ci-node/proxy/stats/summary \
            | jq -c '[.node.fs.capacityBytes, .node.runtime.imageFs.capacityBytes]')
          echo "nodefs and imagefs capacity: $got"; [ "$got" = "[$((3 << 30)),$((4 << 30))]" ]

      - name: A tenant pod writing past its limit on ZFS is evicted
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          k apply -k /opt/arc-on-nas/manifests/tenants > /dev/null
          for _ in $(seq 1 60); do k -n zuul-trial get serviceaccount default >/dev/null 2>&1 && break; sleep 2; done
          # Random data: the pool compresses, and blocks of zeros would take no room.
          writer() {
            jq -n --arg name "$1" --arg dir "$2" --arg mib "$3" --arg image "$BUSYBOX_IMAGE" '
              {apiVersion: "v1", kind: "Pod", metadata: {name: $name}, spec: {restartPolicy: "Never",
                volumes: [{name: "s", emptyDir: {}}],
                containers: [{name: "w", image: $image, volumeMounts: [{name: "s", mountPath: "/scratch"}],
                  command: ["sh", "-c", "dd if=/dev/urandom of=\($dir)/fill bs=1M count=\($mib) && sleep 600"],
                  resources: {limits: {"ephemeral-storage": "64Mi"}}}]}}' \
              | k --as opifex-magnus --as-group devinfra -n zuul-trial apply -f -
          }
          writer fill-volume /scratch 200
          writer fill-layer /tmp 200
          writer within /scratch 16
          for p in fill-volume fill-layer; do
            k -n zuul-trial wait --for=jsonpath='{.status.reason}'=Evicted "pod/$p" --timeout=240s
            echo "$p: $(k -n zuul-trial get pod "$p" -o jsonpath='{.status.phase}: {.status.message}')"
          done
          phase=$(k -n zuul-trial get pod within -o jsonpath='{.status.phase}')
          echo "within: $phase"; [ "$phase" = Running ]

      - name: Diagnostics
        if: failure()
        run: |
          docker compose logs --tail 100 k3s 2>&1 | grep -vE 'shared_informer|Caches are synced' | tail -n 60 || true
          docker compose exec -T k3s kubectl get pods -A -o wide || true
          docker compose exec -T k3s kubectl get events -A --sort-by=.lastTimestamp | tail -n 40 || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --timeout 30 || true
          sudo zpool destroy -f ci || true
          sudo rm -rf kubeconfig "$RUNNER_TEMP/ci-cache" .env docker-compose.override.yml

  smoke:
    name: Smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Above the sum of the waits below (about 28 minutes), so a slow day ends in a wait's own error
    # and the diagnostics; a normal run takes about 4 minutes.
    # More than the stack alone: the Zuul test bed pulls Zuul's images.
    timeout-minutes: 50
    env:
      CHART_VERSION: "0.15.0"
      CHARTS: oci://ghcr.io/actions/actions-runner-controller-charts
      PROXY: http://172.31.250.2:3128
      GATEWAY: 172.31.250.1
      CURL_IMAGE: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
      BUSYBOX_IMAGE: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      # yamllint disable-line rule:line-length
      GRPCURL_IMAGE: fullstorydev/grpcurl:v1.9.3-alpine@sha256:4614424ed58e9b9837c48b6b8eadb9ef40491d5af3499bcc8b378e9c64a9e4a9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Directories and .env sized for this runner
        run: |
          set -euo pipefail
          sudo install -d -o 1001 -g 1001 -m 750 "$RUNNER_TEMP/ci-cache/default"
          sudo install -d -o 0 -g 0 -m 700 kubeconfig
          # Hosted runners have 2 CPUs and 8 GB (private repositories) or 4 and 16 (public). Size
          # as README "Sizing" does: allocatable 1500m CPU and 2560Mi, kube-reserved 250m and
          # 512Mi, the rest reserved for the "host"; caps a little above allocatable + kube-reserved.
          # k3s sets no memory eviction threshold, so nothing else is subtracted.
          cpus=$(nproc)
          mem=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) / 1024 ))
          cat > .env <<EOF
          CACHE_DIR=$RUNNER_TEMP/ci-cache
          K3S_CPUS=$cpus
          K3S_MEMORY=4g
          K3S_CPU_SHARES=256
          K3S_PIDS_LIMIT=32768
          K3S_SYSTEM_RESERVED=cpu=$(( cpus * 1000 - 1500 - 250 ))m,memory=$(( mem - 2560 - 512 ))Mi
          K3S_KUBE_RESERVED=cpu=250m,memory=512Mi
          K3S_SNAPSHOTTER=overlayfs
          K3S_EXTRA_ARGS=
          EOF
          cat .env

      - name: scripts/preflight.sh with the stack's settings
        run: scripts/preflight.sh

      - name: docker compose up
        run: docker compose up -d --wait --wait-timeout 180

      - name: The node is Ready
        run: |
          set -euo pipefail
          # The node object appears a few seconds after the API server answers.
          for _ in $(seq 1 30); do
            docker compose exec -T k3s kubectl get node ci-node >/dev/null 2>&1 && break
            sleep 2
          done
          # Ready needs the system pods' images, which containerd pulls through the proxy.
          docker compose exec -T k3s kubectl wait --for=condition=Ready node/ci-node --timeout=180s
          docker compose exec -T k3s kubectl get node ci-node -o wide
          fmt='capacity {.status.capacity.cpu} CPU {.status.capacity.memory}; '
          fmt+='allocatable {.status.allocatable.cpu} CPU {.status.allocatable.memory}{"\n"}'
          docker compose exec -T k3s kubectl get node ci-node -o jsonpath="$fmt"

      - name: Apply the manifests
        run: |
          set -euo pipefail
          docker compose exec -T k3s kubectl apply -k /opt/arc-on-nas/manifests
          for _ in $(seq 1 30); do
            phase=$(docker compose exec -T k3s kubectl -n arc-runners get pvc ci-cache -o jsonpath='{.status.phase}')
            [ "$phase" = Bound ] && break
            sleep 2
          done
          echo "ci-cache: $phase"
          test "$phase" = Bound

      - name: scripts/register.sh stores a credential
        run: |
          set -euo pipefail
          # A dummy value: nothing registers with GitHub in this test.
          printf 'not-a-real-token\n' > "$RUNNER_TEMP/token"
          scripts/register.sh --token-file "$RUNNER_TEMP/token"
          stored=$(docker compose exec -T k3s kubectl -n arc-runners get secret github-credentials \
            -o jsonpath='{.data.github_token}' | base64 -d)
          test "$stored" = not-a-real-token
          printf 'not-a-real-key\n' > "$RUNNER_TEMP/key.pem"
          scripts/register.sh --name app-test --app-id 1 --installation-id 2 --private-key-file "$RUNNER_TEMP/key.pem"
          keys=$(docker compose exec -T k3s kubectl -n arc-runners get secret app-test \
            -o go-template='{{range $k, $v := .data}}{{$k}} {{end}}')
          test "$keys" = "github_app_id github_app_installation_id github_app_private_key "
          docker compose exec -T k3s kubectl -n arc-runners delete secret app-test
          rm -f "$RUNNER_TEMP/token" "$RUNNER_TEMP/key.pem"
          echo "Both credential forms stored."

      - name: Install the controller chart with the helm service
        run: |
          set -euo pipefail
          docker compose run --rm -T helm upgrade --install arc \
            "$CHARTS/gha-runner-scale-set-controller" --version "$CHART_VERSION" \
            --namespace arc-systems -f helm/controller.yaml --wait --timeout 5m
          docker compose exec -T k3s kubectl -n arc-systems wait --for=condition=Ready pod \
            -l app.kubernetes.io/part-of=gha-rs-controller --timeout=120s
          docker compose exec -T k3s kubectl -n arc-systems get pods -o wide
          docker compose exec -T k3s kubectl get crd autoscalingrunnersets.actions.github.com

      - name: The controller pod meets Pod Security "restricted"
        run: |
          set -euo pipefail
          # A server-side dry run of enforcing "restricted" on arc-systems lists every existing pod
          # that would violate it, as warnings.
          out=$(docker compose exec -T k3s kubectl label --dry-run=server --overwrite namespace arc-systems \
            pod-security.kubernetes.io/enforce=restricted 2>&1)
          echo "$out"
          if echo "$out" | grep -qi warning; then exit 1; fi

      - name: The runner pod templates are admitted by Pod Security "restricted"
        run: |
          set -euo pipefail
          # The pods ARC would create from each scale set's template. Their service account comes
          # with the scale set's chart, which is not installed here: the default one stands in.
          for s in swift ubuntu browser; do
            docker compose run --rm -T helm template "$s" "$CHARTS/gha-runner-scale-set" \
              --version "$CHART_VERSION" --namespace arc-runners -f "helm/$s.yaml" \
              --set githubConfigUrl=https://github.com/OWNER/REPO > "$RUNNER_TEMP/$s.yaml"
            yq 'select(.kind == "AutoscalingRunnerSet") | {"apiVersion": "v1", "kind": "Pod",
                "metadata": {"name": "'"$s"'-runner", "namespace": "arc-runners"}, "spec": .spec.template.spec}
                | del(.spec.serviceAccountName)' "$RUNNER_TEMP/$s.yaml" > "$RUNNER_TEMP/$s-pod.yaml"
            docker compose exec -T k3s kubectl apply --dry-run=server -f - < "$RUNNER_TEMP/$s-pod.yaml"
          done
          # And a privileged pod is refused.
          overrides='{"spec":{"containers":[{"name":"privileged","image":"'"$CURL_IMAGE"'",'
          overrides+='"securityContext":{"privileged":true}}]}}'
          if docker compose exec -T k3s kubectl -n arc-runners run privileged --dry-run=server \
               --image="$CURL_IMAGE" --overrides="$overrides" 2> "$RUNNER_TEMP/refused.txt"; then
            echo "A privileged pod was admitted to arc-runners." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/refused.txt"
          grep -q 'violates PodSecurity "restricted' "$RUNNER_TEMP/refused.txt"

      - name: Egress from a runner-like pod
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          # A listener on the host, to show what the NetworkPolicy blocks.
          python3 -m http.server 18080 --bind 0.0.0.0 > /dev/null 2>&1 &
          # Restricted, uid 1001, the cache claim mounted: what a runner pod gets.
          k apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: egress-test
            namespace: arc-runners
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              seccompProfile: {type: RuntimeDefault}
            containers:
              - name: test
                image: $CURL_IMAGE
                command: ["sleep", "600"]
                resources:
                  requests: {cpu: 100m, memory: 64Mi}
                  limits: {cpu: 100m, memory: 64Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                volumeMounts:
                  - {name: cache, mountPath: /home/runner/cache}
            volumes:
              - name: cache
                persistentVolumeClaim: {claimName: ci-cache}
          EOF
          k -n arc-runners wait --for=condition=Ready pod/egress-test --timeout=180s
          run() { k -n arc-runners exec egress-test -- "$@"; }
          code() { run curl -sS -o /dev/null -m 15 -w '%{http_code}' "$@" || true; }
          # For HTTPS through the proxy: the proxy's answer to CONNECT (http_code stays 000 when
          # the tunnel is refused, as it does when the proxy is down or the request times out).
          connect_code() { run curl -sS -o /dev/null -m 15 -w '%{http_connect}' "$@" || true; }

          run sh -c 'f=/home/runner/cache/smoke-test; echo ok > $f && cat $f && rm $f'
          echo "cache: writable as uid 1001"

          c=$(code -x "$PROXY" https://github.com/); echo "github.com through the proxy: $c"
          [ "$c" = 200 ]
          c=$(code -x "$PROXY" http://169.254.169.254/); echo "link-local through the proxy: $c"
          [ "$c" = 403 ]
          c=$(connect_code -x "$PROXY" https://10.43.0.1/); echo "a private address through the proxy: CONNECT $c"
          [ "$c" = 403 ]
          # curl's exit code 6 means the name did not resolve; anything else means DNS answered.
          rc=0; run curl -sk -o /dev/null -m 5 https://kubernetes.default.svc/version || rc=$?
          echo "cluster DNS: curl exit $rc"
          [ "$rc" != 6 ]
          c=$(code --noproxy '*' https://1.1.1.1/); echo "the internet without the proxy: $c"
          [ "$c" = 000 ]

          # The host's port through the stack network's gateway: open to a plain container on the
          # network (Docker's documented limit), closed to the pod (the NetworkPolicy).
          c=$(docker run --rm --network ci_runners "$CURL_IMAGE" \
                -sS -o /dev/null -m 10 -w '%{http_code}' "http://$GATEWAY:18080/" || true)
          echo "host port via the gateway, from a container on the network: $c"
          # The control: without it, the pod's failure below would prove nothing.
          [ "$c" = 200 ]
          c=$(code --noproxy '*' "http://$GATEWAY:18080/"); echo "host port via the gateway, from the pod: $c"
          [ "$c" = 000 ]
          k -n arc-runners delete pod egress-test --wait=false

      - name: The tenant namespaces
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          k apply -k /opt/arc-on-nas/manifests/tenants
          u=opifex-magnus
          # What the Role allows and refuses, asked as the user with the group of their certificate.
          can() { k auth can-i --as "$u" --as-group devinfra "$@" 2>/dev/null || true; }
          for q in "-n zuul-trial create pods" "-n zuul-trial create pods --subresource=exec" \
                   "-n build-farm create deployments.apps" "-n zuul-trial create secrets"; do
            # shellcheck disable=SC2086 # $q is the question's words
            a=$(can $q); echo "can $q: $a"; [ "$a" = yes ]
          done
          for q in "-n arc-runners list pods" "-n arc-systems get secrets" "list nodes" "list namespaces" \
                   "list persistentvolumes" "create persistentvolumes" "patch namespaces" \
                   "create certificatesigningrequests" \
                   "update certificatesigningrequests --subresource=approval" "-n zuul-trial create rolebindings" \
                   "-n zuul-trial create roles" "-n zuul-trial patch networkpolicies" \
                   "-n zuul-trial create endpoints" "-n zuul-trial create endpointslices.discovery.k8s.io" \
                   "-n zuul-trial create serviceaccounts --subresource=token" \
                   "-n zuul-trial update resourcequotas" "impersonate users" \
                   "-n zuul-trial update pods --subresource=ephemeralcontainers" \
                   "-n zuul-trial get pods --subresource=proxy" "-n zuul-trial get services --subresource=proxy" \
                   "-n zuul-trial update services --subresource=status" "get nodes --subresource=proxy"; do
            # shellcheck disable=SC2086 # $q is the question's words
            a=$(can $q); echo "can $q: $a"; [ "$a" = no ]
          done

          # The build farm's cache volume binds to its claim, and a claim in another tenant's namespace
          # that names it stays unbound (manifests/tenants/build-farm/cache-volume.yaml, claimRef).
          k -n build-farm wait --for=jsonpath='{.status.phase}'=Bound pvc/cache --timeout=60s
          b=$(k get pv build-farm-cache -o jsonpath='{.spec.claimRef.namespace}/{.spec.claimRef.name}')
          echo "build-farm-cache bound to $b"; [ "$b" = build-farm/cache ]
          k --as "$u" --as-group devinfra -n zuul-trial apply -f - <<< '{"apiVersion":"v1",
            "kind":"PersistentVolumeClaim","metadata":{"name":"other-cache"},"spec":{"accessModes":
            ["ReadWriteOnce"],"storageClassName":"","volumeName":"build-farm-cache",
            "resources":{"requests":{"storage":"1Gi"}}}}'
          if k -n zuul-trial wait --for=jsonpath='{.status.phase}'=Bound pvc/other-cache --timeout=15s; then
            echo "a zuul-trial claim got build-farm-cache" >&2; exit 1
          fi
          k -n zuul-trial delete pvc other-cache

          # What admission refuses: each must fail, with the reason in its message.
          refused() {
            local why=$1; shift
            if k --as "$u" --as-group devinfra -n zuul-trial "$@" --dry-run=server > /dev/null \
                 2> "$RUNNER_TEMP/refused.txt"; then
              echo "Admitted, but should be refused ($why): $*" >&2; exit 1
            fi
            grep -q "$why" "$RUNNER_TEMP/refused.txt" || { cat "$RUNNER_TEMP/refused.txt" >&2; exit 1; }
            echo "refused ($why): $(head -c 160 "$RUNNER_TEMP/refused.txt")"
          }
          # A pod as JSON: $1 is added to its spec, $2 to its container, $3 replaces the image.
          pod() {
            printf '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"t"},"spec":{%s' "$1"
            printf '"containers":[{"name":"t","image":"%s"%s}]}}' "${3:-$CURL_IMAGE}" "$2"
          }
          refused 'violates PodSecurity "baseline' apply -f - <<< "$(pod '' ',"securityContext":{"privileged":true}')"
          refused 'violates PodSecurity "baseline' apply -f - \
            <<< "$(pod '"volumes":[{"name":"h","hostPath":{"path":"/"}}],' '')"
          refused 'violates PodSecurity "baseline' apply -f - <<< "$(pod '"hostNetwork":true,' '')"
          refused 'violates PodSecurity "baseline' apply -f - \
            <<< "$(pod '' ',"securityContext":{"capabilities":{"add":["NET_RAW"]}}')"
          refused 'tenant namespaces allow only these volume types' apply -f - \
            <<< "$(pod '"volumes":[{"name":"n","nfs":{"server":"'"$GATEWAY"'","path":"/"}}],' '')"
          refused 'tenant namespaces pull images only from registries on the internet' apply -f - \
            <<< "$(pod '' '' registry-scratch.arc-scratch.svc:5000/x:1)"
          refused 'tenant namespaces pull images only from registries on the internet' apply -f - \
            <<< "$(pod '' '' "$GATEWAY:5000/x:1")"
          refused 'tenant namespaces pull images only from registries on the internet' apply -f - \
            <<< "$(pod '' '' localhost:5000/x:1)"
          k -n zuul-trial create service clusterip ext --tcp=3128:3128 --dry-run=client -o json \
            | jq '.spec.externalIPs = ["172.31.250.2"]' > "$RUNNER_TEMP/svc-ext.json"
          refused 'tenant namespaces allow no Service with spec.externalIPs' apply -f - < "$RUNNER_TEMP/svc-ext.json"
          refused 'services.nodeports' create service nodeport np --tcp=80:80
          refused 'no-priority-class' apply -f - <<< "$(pod '"priorityClassName":"system-cluster-critical",' '')"
          # A plain pod is admitted, with the LimitRange's memory limit and NET_RAW dropped; a pod
          # that drops ALL keeps exactly that.
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json -f - <<< "$(pod '' '')" \
            | jq -c '.spec.containers[0] | [.resources.limits.memory, .securityContext.capabilities.drop]')
          echo "plain pod: $got"; [ "$got" = '["512Mi",["NET_RAW"]]' ]
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json \
                  -f - <<< "$(pod '' ',"securityContext":{"capabilities":{"drop":["ALL"]}}')" \
            | jq -c '.spec.containers[0].securityContext.capabilities.drop')
          echo "pod dropping ALL: $got"; [ "$got" = '["ALL"]' ]
          # Each container keeps its own drops and gains NET_RAW: an init container and two others.
          cat > "$RUNNER_TEMP/three.json" <<EOF
          {"apiVersion": "v1", "kind": "Pod", "metadata": {"name": "t"}, "spec": {
            "initContainers": [{"name": "i", "image": "$CURL_IMAGE"}],
            "containers": [
              {"name": "a", "image": "$CURL_IMAGE", "securityContext": {"capabilities": {"drop": ["CHOWN"]}}},
              {"name": "b", "image": "$CURL_IMAGE", "securityContext": {"capabilities": {"drop": ["ALL"]}}}]}}
          EOF
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json -f - \
                  < "$RUNNER_TEMP/three.json" \
            | jq -c '[.spec.initContainers[], .spec.containers[]]
                     | map({(.name): .securityContext.capabilities.drop}) | add')
          echo "drops: $got"; [ "$got" = '{"i":["NET_RAW"],"a":["CHOWN","NET_RAW"],"b":["ALL"]}' ]
          # Disk: the LimitRange's ephemeral-storage default and maximum, the quota's total, and a
          # pod that writes past its limit is evicted, into an emptyDir or into its own layer, while
          # one that stays within it runs on. Needs the kubelet's local storage isolation (on here).
          fmt='{.status.capacity.ephemeral-storage} capacity, {.status.allocatable.ephemeral-storage} allocatable'
          echo "node ephemeral-storage: $(k get node ci-node -o jsonpath="$fmt")"
          { k get --raw /api/v1/nodes/ci-node/proxy/configz \
              | jq -c '.kubeletconfig | {localStorageCapacityIsolation, evictionHard, volumeStatsAggPeriod}'; } \
            || echo "the kubelet's configz did not answer"
          got=$(k --as "$u" --as-group devinfra -n zuul-trial apply --dry-run=server -o json -f - <<< "$(pod '' '')" \
            | jq -c '.spec.containers[0].resources | [.requests["ephemeral-storage"], .limits["ephemeral-storage"]]')
          echo "plain pod's ephemeral-storage: $got"; [ "$got" = '["64Mi","512Mi"]' ]
          refused 'maximum ephemeral-storage usage per Container is 3Gi' apply -f - \
            <<< "$(pod '' ',"resources":{"limits":{"ephemeral-storage":"4Gi"}}')"
          two='"resources":{"limits":{"ephemeral-storage":"3Gi"}}'
          cat > "$RUNNER_TEMP/two.json" <<EOF
          {"apiVersion": "v1", "kind": "Pod", "metadata": {"name": "t"}, "spec": {"containers": [
            {"name": "a", "image": "$CURL_IMAGE", $two}, {"name": "b", "image": "$CURL_IMAGE", $two}]}}
          EOF
          refused 'exceeded quota: budget' apply -f - < "$RUNNER_TEMP/two.json"
          # writer <name> <dir> <MiB>: a pod with a 64Mi limit that writes <MiB> into <dir>, then
          # waits; /scratch is an emptyDir, anything else is in the container's own layer. Random
          # data, not zeros: on a compressing filesystem (ZFS) zeros take no blocks, and the kubelet
          # counts blocks.
          writer() {
            jq -n --arg name "$1" --arg dir "$2" --arg mib "$3" --arg image "$BUSYBOX_IMAGE" '
              {apiVersion: "v1", kind: "Pod", metadata: {name: $name}, spec: {restartPolicy: "Never",
                containers: [{name: "w", image: $image,
                  command: ["sh", "-c", "dd if=/dev/urandom of=\($dir)/fill bs=1M count=\($mib) && sleep 600"],
                  resources: {limits: {"ephemeral-storage": "64Mi"}}}]}}
              | if $dir == "/scratch" then .spec.volumes = [{name: "s", emptyDir: {}}]
                  | .spec.containers[0].volumeMounts = [{name: "s", mountPath: "/scratch"}] else . end' \
              | k --as "$u" --as-group devinfra -n zuul-trial apply -f -
          }
          writer fill-volume /scratch 200
          writer fill-layer /tmp 200
          writer within /scratch 16
          # The kubelet adds up emptyDir volumes about once a minute (its volume stats period).
          for p in fill-volume fill-layer; do
            k -n zuul-trial wait --for=jsonpath='{.status.reason}'=Evicted "pod/$p" --timeout=240s
            echo "$p: $(k -n zuul-trial get pod "$p" -o jsonpath='{.status.phase}: {.status.message}')"
          done
          phase=$(k -n zuul-trial get pod within -o jsonpath='{.status.phase}')
          echo "within: $phase"; [ "$phase" = Running ]
          k -n zuul-trial delete pod fill-volume fill-layer within --wait=false

          # A running pod's image cannot be changed to a refused one.
          k --as "$u" --as-group devinfra -n zuul-trial apply -f - <<< "$(pod '' ',"command":["sleep","600"]')"
          patch='[{"op":"replace","path":"/spec/containers/0/image",'
          patch+='"value":"registry-scratch.arc-scratch.svc:5000/x:1"}]'
          refused 'tenant namespaces pull images only from registries on the internet' \
            patch pod t --type=json -p "$patch"
          k -n zuul-trial delete pod t --wait=false

          # tenant-cert.sh refuses any other subject, and creates no CertificateSigningRequest for it.
          key=$RUNNER_TEMP/tenant.key
          openssl ecparam -name prime256v1 -genkey -noout -out "$key"
          before=$(k get csr --no-headers 2>/dev/null | wc -l)
          for subj in "/CN=$u/O=system:masters" "/CN=$u/OU=x/O=devinfra" "/CN=$u/O=devinfra/O=x" \
                      "/CN=t3c-artifex-prime/O=devinfra" "/CN=$u/CN=$u/O=devinfra"; do
            openssl req -new -key "$key" -subj "$subj" -out "$RUNNER_TEMP/bad.csr"
            if scripts/tenant-cert.sh "$u" "$RUNNER_TEMP/bad.csr" --out "$RUNNER_TEMP" 2> "$RUNNER_TEMP/out.txt"; then
              echo "tenant-cert.sh signed $subj" >&2; exit 1
            fi
            grep -q '^Refused' "$RUNNER_TEMP/out.txt" || { cat "$RUNNER_TEMP/out.txt" >&2; exit 1; }
            echo "$subj: $(grep '^Refused' "$RUNNER_TEMP/out.txt")"
          done
          openssl req -new -key "$key" -subj "/CN=$u/O=devinfra" -addext "subjectAltName=DNS:x" \
            -out "$RUNNER_TEMP/bad.csr"
          if scripts/tenant-cert.sh "$u" "$RUNNER_TEMP/bad.csr" --out "$RUNNER_TEMP"; then
            echo "tenant-cert.sh signed a request with a subject alternative name" >&2; exit 1
          fi
          [ "$(k get csr --no-headers 2>/dev/null | wc -l)" = "$before" ]

          # A real certificate and the kubeconfig the script writes, used by kubectl through the
          # forwarder from a container on another network. The credential plugin prints the
          # certificate and key from a file here; on a user's machine they come from a secret store.
          openssl req -new -key "$key" -subj "/CN=$u/O=devinfra" -out "$RUNNER_TEMP/tenant.csr"
          scripts/tenant-cert.sh "$u" "$RUNNER_TEMP/tenant.csr" --namespace zuul-trial --out "$RUNNER_TEMP"
          jq -n --rawfile cert "$RUNNER_TEMP/$u.crt" --rawfile key "$key" \
            '{apiVersion: "client.authentication.k8s.io/v1", kind: "ExecCredential",
              status: {clientCertificateData: $cert, clientKeyData: $key}}' > "$RUNNER_TEMP/credential.json"
          printf '#!/bin/sh\ncat /t/credential.json\n' > "$RUNNER_TEMP/tenant-credential"
          chmod +x "$RUNNER_TEMP/tenant-credential"
          docker network create tenants-test
          API_FORWARD_NETWORK=tenants-test docker compose -f api-forward.yml up -d --wait
          k3s_image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q k3s)")
          tk() {
            docker run --rm -u "$(id -u)" --network tenants-test -v "$RUNNER_TEMP:/t:ro" --entrypoint kubectl \
              "$k3s_image" --kubeconfig "/t/$u.kubeconfig" "$@"
          }
          tk get pods
          tk auth whoami
          for q in "-n arc-runners get pods" "get nodes" "get namespaces"; do
            # shellcheck disable=SC2086 # $q is the command's words
            if tk $q 2> "$RUNNER_TEMP/out.txt"; then echo "allowed: $q" >&2; exit 1; fi
            grep -q Forbidden "$RUNNER_TEMP/out.txt" || { cat "$RUNNER_TEMP/out.txt" >&2; exit 1; }
            echo "forbidden: $q"
          done
          # Without a certificate, nothing at all.
          yq '.clusters[0].cluster."certificate-authority-data"' "$RUNNER_TEMP/$u.kubeconfig" \
            | base64 -d > "$RUNNER_TEMP/ca.crt"
          for p in /version /api/v1/namespaces/zuul-trial/pods; do
            c=$(docker run --rm -u "$(id -u)" --network tenants-test -v "$RUNNER_TEMP:/t:ro" "$CURL_IMAGE" \
                  -sS -o /dev/null -w '%{http_code}' -m 10 --cacert /t/ca.crt \
                  --connect-to kubernetes:6443:k3s-api:6443 "https://kubernetes:6443$p" || true)
            echo "$p without a certificate: $c"; [ "$c" = 401 ]
          done

          # The NetworkPolicies, from a tenant pod. Servers: one in the same namespace, one in the
          # other tenant, one in default (no policies) behind a NodePort, and a port on the host.
          python3 -m http.server 18081 --bind 0.0.0.0 > /dev/null 2>&1 &
          serve() { k -n "$1" run "$2" --image="$BUSYBOX_IMAGE" --port=8080 --command -- httpd -f -p 8080; }
          serve zuul-trial same; serve build-farm other; serve default open
          k -n default expose pod open --type=NodePort --port=8080
          k -n zuul-trial run client --image="$CURL_IMAGE" --command -- sleep 600
          k -n default run control --image="$CURL_IMAGE" --command -- sleep 600
          for p in zuul-trial/same build-farm/other default/open zuul-trial/client default/control; do
            k -n "${p%/*}" wait --for=condition=Ready "pod/${p#*/}" --timeout=180s
          done
          ip() { k -n "$1" get pod "$2" -o jsonpath='{.status.podIP}'; }
          nodeport=$(k -n default get service open -o jsonpath='{.spec.ports[0].nodePort}')
          from() {
            k -n "$1" exec "$2" -- curl -ksS -o /dev/null -m 5 -w '%{http_code}' --noproxy '*' "$3" 2>/dev/null || true
          }
          # "answers" is any HTTP status; 000 is no connection.
          expect() {
            local c; c=$(from "$1" "$2" "$3"); echo "$1/$2 -> $3: $c (want $4)"
            if [ "$4" = answers ]; then [[ "$c" =~ ^[1-5][0-9]{2}$ ]]; else [ "$c" = "$4" ]; fi
          }
          expect zuul-trial client "http://$(ip zuul-trial same):8080/" answers
          expect zuul-trial client "http://$(ip default open):8080/" answers
          expect zuul-trial client "http://$(ip build-farm other):8080/" 000
          expect default control "http://$(ip zuul-trial same):8080/" 000
          # The controls show each address answers when a policy is not in the way.
          expect default control "http://172.31.250.10:$nodeport/" answers
          expect default control "http://10.42.0.1:$nodeport/" answers
          expect default control "http://$GATEWAY:18081/" answers
          expect default control "https://172.31.250.10:6443/" answers
          expect default control "https://172.31.250.11:6443/" answers
          expect default control "https://10.43.0.1:443/" answers
          # A NodePort reaches what its pod's own address does (here a pod with no policy).
          expect zuul-trial client "http://172.31.250.10:$nodeport/" answers
          expect zuul-trial client "http://$GATEWAY:18081/" 000
          expect zuul-trial client "https://172.31.250.10:6443/" 000
          expect zuul-trial client "https://10.43.0.1:443/" 000
          expect zuul-trial client "https://172.31.250.11:6443/" 000
          c=$(k -n zuul-trial exec client -- curl -sS -o /dev/null -m 15 -w '%{http_code}' -x "$PROXY" \
                https://github.com/ || true)
          echo "github.com through the proxy from the tenant pod: $c"; [ "$c" = 200 ]
          k -n zuul-trial delete pod same client --wait=false
          k -n build-farm delete pod other --wait=false
          k -n default delete pod open control --wait=false
          k -n default delete service open
          docker compose -p ci-api down

      - name: The build farm's server
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          u=opifex-magnus
          tk() { k --as "$u" --as-group devinfra -n build-farm "$@"; }
          # The directory the cache volume names, owned by the storage pod's user. On a host it is a
          # filesystem of its own, bind-mounted into the node (README, "Tenant namespaces"); here
          # it is a directory in the node's container.
          docker compose exec -T k3s sh -c 'd=/var/lib/build-farm-cache/storage
            mkdir -p "$d" && chown 65532:65532 "$d" && chmod 700 "$d"'
          # The farm's CA and the frontend's key pair, as the tenant makes them (README, "The build
          # farm's network"). The CA stays in $RUNNER_TEMP for the next step's renewal.
          scripts/farm-tls.sh ca "$RUNNER_TEMP/farm-ca"
          scripts/farm-tls.sh server --ca-cert "$RUNNER_TEMP/farm-ca/ca.crt" --ca-key "$RUNNER_TEMP/farm-ca/ca.key" \
            | tk apply -f -
          # The CA for the clients in the cluster, which trust it and nothing else for the farm.
          ca=$(cat "$RUNNER_TEMP/farm-ca/ca.crt")
          for ns in build-farm arc-runners zuul-trial default; do
            k -n "$ns" create configmap build-farm-ca --from-literal=ca.crt="$ca"
          done
          # Applied by the tenant, as on a host.
          server=/opt/arc-on-nas/manifests/tenants/build-farm/server
          tk apply -k "$server"
          k -n build-farm rollout status statefulset/storage --timeout=300s
          k -n build-farm rollout status deployment/scheduler --timeout=180s
          k -n build-farm rollout status deployment/frontend --timeout=180s
          k -n build-farm get pods -o wide
          k -n build-farm get services
          # A client in build-farm, as the farm's clients in the cluster will be (restricted, uid 65532).
          jq -n --arg image "$GRPCURL_IMAGE" '
            {apiVersion: "v1", kind: "Pod", metadata: {name: "client"}, spec: {
              automountServiceAccountToken: false,
              securityContext: {runAsUser: 65532, runAsGroup: 65532, runAsNonRoot: true,
                seccompProfile: {type: "RuntimeDefault"}},
              volumes: [{name: "ca", configMap: {name: "build-farm-ca"}}],
              containers: [{name: "c", image: $image, command: ["sleep", "900"],
                volumeMounts: [{name: "ca", mountPath: "/ca", readOnly: true}],
                securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}}]}}' \
            | tk apply -f -
          k -n build-farm wait --for=condition=Ready pod/client --timeout=180s
          # call <method> <request>: one gRPC call to the frontend's Service from the client, over
          # TLS with the farm's CA, the method found by the server's reflection service; prints
          # the response. store: the same to the storage pod, which only the namespace reaches.
          call() { k -n build-farm exec client -- grpcurl -cacert /ca/ca.crt -max-time 20 -d "$2" frontend:8980 "$1"; }
          store() {
            k -n build-farm exec client -- grpcurl -plaintext -max-time 20 -d "$2" storage-0.storage:8981 "$1"
          }
          # retry <command...>: until it succeeds, for up to a minute. A new pod's address reaches
          # the network policies and a new Service's endpoints reach kube-proxy a little after
          # the pod is ready; until then a connection is refused.
          retry() {
            for _ in $(seq 1 20); do "$@" && return 0; sleep 3; done
            "$@"
          }
          retry call grpc.health.v1.Health/Check '{}'
          # No plain-text gRPC on the frontend.
          if k -n build-farm exec client -- grpcurl -plaintext -max-time 10 frontend:8980 \
               grpc.health.v1.Health/Check; then
            echo "the frontend answered without TLS" >&2; exit 1
          fi
          echo "the frontend without TLS: refused"
          re=build.bazel.remote.execution.v2
          data="arc-on-nas smoke test $(date -u +%FT%TZ)"
          b64=$(printf %s "$data" | base64 -w0)
          digest=$(jq -nc --arg h "$(printf %s "$data" | sha256sum | cut -d' ' -f1)" --argjson s "${#data}" \
            '{hash: $h, size_bytes: $s}')
          result="{\"action_digest\":$digest,\"action_result\":{\"exit_code\":42,\"stdout_raw\":\"$b64\"}}"
          # check <when>: the blob and the action result read back through the frontend. Each step
          # returns on failure itself: under retry, set -e does not apply inside it.
          check() {
            local got
            got=$(call "$re.ContentAddressableStorage/BatchReadBlobs" "{\"digests\":[$digest]}" \
              | jq -r '.responses[0].data') || return 1
            echo "$1, the blob read back: $(base64 -d <<< "$got")"; [ "$got" = "$b64" ] || return 1
            got=$(call "$re.ActionCache/GetActionResult" "{\"action_digest\":$digest}" \
              | jq -c '[.exitCode, .stdoutRaw]') || return 1
            echo "$1, the action result: $got"; [ "$got" = "[42,\"$b64\"]" ] || return 1
          }
          call "$re.ContentAddressableStorage/BatchUpdateBlobs" \
            "{\"requests\":[{\"digest\":$digest,\"data\":\"$b64\"}]}"
          # A client may not write an action result through the frontend; the workers write them to
          # the storage pod, as this does.
          if call "$re.ActionCache/UpdateActionResult" "$result" 2> "$RUNNER_TEMP/out.txt"; then
            echo "the frontend took an action result from a client" >&2; exit 1
          fi
          grep -q PermissionDenied "$RUNNER_TEMP/out.txt" || { cat "$RUNNER_TEMP/out.txt" >&2; exit 1; }
          echo "an action result through the frontend: $(tr '\n' ' ' < "$RUNNER_TEMP/out.txt")"
          store "$re.ActionCache/UpdateActionResult" "$result"
          check written
          # The cache's files are on the volume, at their configured size, and sparse.
          docker compose exec -T k3s sh -c 'cd /var/lib/build-farm-cache/storage
            ls -ln cas ac; du -sh .'
          size=$(docker compose exec -T k3s stat -c %s /var/lib/build-farm-cache/storage/cas/blocks)
          echo "cas/blocks: $size bytes"; [ "$size" = 137438953472 ]
          # The storage pod restarts (stopped, as on an update or a drain) and keeps both.
          k -n build-farm delete pod storage-0
          for _ in $(seq 1 30); do k -n build-farm get pod storage-0 > /dev/null 2>&1 && break; sleep 2; done
          k -n build-farm wait --for=condition=Ready pod/storage-0 --timeout=180s
          retry check "after a restart"
          k -n build-farm logs storage-0
          k -n build-farm delete pod client --wait=false

      - name: The build farm's network and TLS
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          u=opifex-magnus
          # Who reaches the frontend (README, "The build farm's network"): a runner pod through the
          # cluster's DNS, a container on another Docker network through the forwarder, and nothing
          # else: not the other tenant, not another namespace, not the host, not another address on
          # the stack network. Each client below trusts the farm's CA and checks the name.
          docker network create farm-test
          FARM_FORWARD_NETWORK=farm-test docker compose -f farm-forward.yml up -d --wait
          # The CA alone, readable by the containers below.
          install -d -m 755 "$RUNNER_TEMP/farm-ca-public"
          install -m 644 "$RUNNER_TEMP/farm-ca/ca.crt" "$RUNNER_TEMP/farm-ca-public/ca.crt"
          # client: a restricted pod with grpcurl and the CA, as the runners are (uid 1001).
          client() {
            jq -n --arg image "$GRPCURL_IMAGE" --argjson uid 1001 '
              {apiVersion: "v1", kind: "Pod", metadata: {name: "farm-client"}, spec: {
                automountServiceAccountToken: false,
                securityContext: {runAsUser: $uid, runAsGroup: $uid, runAsNonRoot: true,
                  seccompProfile: {type: "RuntimeDefault"}},
                volumes: [{name: "ca", configMap: {name: "build-farm-ca"}}],
                containers: [{name: "c", image: $image, command: ["sleep", "900"],
                  resources: {requests: {cpu: "50m", memory: "32Mi"}, limits: {cpu: "200m", memory: "64Mi"}},
                  volumeMounts: [{name: "ca", mountPath: "/ca", readOnly: true}],
                  securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}}]}}'
          }
          client | k -n arc-runners apply -f -
          client | k -n default apply -f -
          client | k --as "$u" --as-group devinfra -n zuul-trial apply -f -
          for ns in arc-runners default zuul-trial; do
            k -n "$ns" wait --for=condition=Ready pod/farm-client --timeout=180s
          done
          # health <namespace> <address>: the frontend's health over TLS from that namespace's pod.
          health() {
            k -n "$1" exec farm-client -- grpcurl -cacert /ca/ca.crt -max-time 10 "$2" grpc.health.v1.Health/Check 2>&1
          }
          # reaches <namespace> <address>: it answers SERVING (after a minute of retries at most:
          # a new pod's address reaches the policies a little after it is ready).
          reaches() {
            local out
            for _ in $(seq 1 20); do
              out=$(health "$1" "$2") && grep -q SERVING <<< "$out" && { echo "$1 -> $2: SERVING"; return 0; }
              sleep 3
            done
            echo "$1 -> $2: $out" >&2; return 1
          }
          # refused <namespace> <address>: no connection at all, so not even TLS starts.
          refused() {
            local out
            if out=$(health "$1" "$2"); then echo "$1 -> $2 answered: $out" >&2; return 1; fi
            grep -q 'Failed to dial target host' <<< "$out" || { echo "$1 -> $2: $out" >&2; return 1; }
            echo "$1 -> $2: refused"
          }
          reaches arc-runners frontend.build-farm.svc:8980
          reaches arc-runners frontend.build-farm.svc.cluster.local:8980
          # The runners reach the frontend only, not the farm's other servers.
          rc=0
          k -n arc-runners exec farm-client -- grpcurl -plaintext -max-time 10 \
            storage-0.storage.build-farm.svc:8981 grpc.health.v1.Health/Check || rc=$?
          echo "arc-runners -> storage-0.storage.build-farm.svc:8981: exit $rc"; [ "$rc" != 0 ]
          refused zuul-trial frontend.build-farm.svc:8980
          refused default frontend.build-farm.svc:8980
          # The NodePort, on the node's address, turns away every source but the forwarder's.
          refused default 172.31.250.10:30980
          refused zuul-trial 172.31.250.10:30980
          c=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' -k "https://172.31.250.10:30980/" || true)
          echo "the host -> 172.31.250.10:30980: $c (want 000)"; [ "$c" = 000 ]
          # The control: the host reaches the node's address, so the 000 above is the policy.
          c=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' -k "https://172.31.250.10:6443/version" || true)
          echo "the host -> 172.31.250.10:6443: $c (want 401)"; [ "$c" = 401 ]
          c=$(docker run --rm --network ci_runners "$GRPCURL_IMAGE" -insecure -max-time 10 172.31.250.10:30980 \
                grpc.health.v1.Health/Check 2>&1 || true)
          echo "another address on the stack network -> 172.31.250.10:30980: $c"
          grep -q 'Failed to dial target host' <<< "$c"
          # Through the forwarder, from another Docker network, as the boxes do: the health, and the
          # blob the previous step wrote.
          far() {
            docker run --rm --network farm-test -v "$RUNNER_TEMP/farm-ca-public:/t:ro" "$GRPCURL_IMAGE" \
              -cacert /t/ca.crt -max-time 10 "$@"
          }
          for _ in $(seq 1 20); do far build-farm:8980 grpc.health.v1.Health/Check && break; sleep 3; done
          far build-farm:8980 grpc.health.v1.Health/Check | grep -q SERVING
          echo "farm-test -> build-farm:8980: SERVING"
          if far -plaintext build-farm:8980 grpc.health.v1.Health/Check 2> /dev/null; then
            echo "the forwarder's port answered without TLS" >&2; exit 1
          fi
          echo "farm-test -> build-farm:8980 without TLS: refused"
          # The forwarder carries nobody else as itself: it listens only on its farm-test address,
          # and turns away that network's gateway, which is the host.
          docker logs "$(docker ps -q --filter label=com.docker.compose.project=ci-farm)"
          c=$(docker run --rm --network ci_runners "$GRPCURL_IMAGE" -insecure -max-time 10 172.31.250.12:8980 \
                grpc.health.v1.Health/Check 2>&1 || true)
          echo "another address on the stack network -> the forwarder's 172.31.250.12:8980: $c"
          grep -q 'Failed to dial target host' <<< "$c"
          fwd_ip=$(docker inspect --format '{{(index .NetworkSettings.Networks "farm-test").IPAddress}}' \
            "$(docker ps -q --filter label=com.docker.compose.project=ci-farm)")
          for a in 172.31.250.12 "$fwd_ip"; do
            c=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' --cacert "$RUNNER_TEMP/farm-ca-public/ca.crt" \
                  --connect-to "build-farm:8980:$a:8980" https://build-farm:8980/ 2>&1 || true)
            echo "the host -> the forwarder's $a:8980: $c"; [ "${c: -3}" = 000 ]
          done
          # Nor from another of the host's addresses, outside the forwarder's subnet: here the stack
          # network's gateway, which any process on the host may connect from.
          c=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' --cacert "$RUNNER_TEMP/farm-ca-public/ca.crt" \
                --interface "$GATEWAY" --connect-to "build-farm:8980:$fwd_ip:8980" \
                https://build-farm:8980/ 2>&1 || true)
          echo "the host from $GATEWAY -> the forwarder's $fwd_ip:8980: $c"; [ "${c: -3}" = 000 ]
          docker logs "$(docker ps -q --filter label=com.docker.compose.project=ci-farm)" 2>&1 | tail -n 5

          # Renewal: a new key pair in the Secret, served from then on without a restart. The
          # kubelet updates the volume within about a minute or two, and bb-storage reads it again
          # every minute.
          # served: the serial of the certificate the forwarder's clients get, in lower case without
          # leading zeros (curl's %{certs} lists the server's certificate first).
          served() {
            docker run --rm --network farm-test -v "$RUNNER_TEMP/farm-ca-public:/t:ro" "$CURL_IMAGE" \
              -sS -o /dev/null -m 10 -w '%{certs}' --cacert /t/ca.crt https://build-farm:8980/ 2> /dev/null \
              | sed -n 's/^Serial Number: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f' | sed 's/^0*//'
          }
          before=$(served); echo "served before the renewal: $before"
          restarts() {
            k -n build-farm get pods -l app.kubernetes.io/name=frontend \
              -o jsonpath='{.items[*].status.containerStatuses[0].restartCount}'
          }
          restarts=$(restarts)
          scripts/farm-tls.sh server --ca-cert "$RUNNER_TEMP/farm-ca/ca.crt" --ca-key "$RUNNER_TEMP/farm-ca/ca.key" \
            2> "$RUNNER_TEMP/renewed.txt" | k --as "$u" --as-group devinfra -n build-farm apply -f -
          want=$(sed -n 's/^serial=//p' "$RUNNER_TEMP/renewed.txt" | tr 'A-F' 'a-f' | sed 's/^0*//')
          echo "renewed: serial $want"
          [ -n "$before" ] && [ "$before" != "$want" ]
          now=""
          for _ in $(seq 1 60); do now=$(served); [ "$now" = "$want" ] && break; sleep 5; done
          echo "served after the renewal: $now"; [ "$now" = "$want" ]
          after=$(restarts)
          echo "frontend restarts: $restarts before, $after after"; [ "$restarts" = "$after" ]
          far build-farm:8980 grpc.health.v1.Health/Check | grep -q SERVING

          for ns in arc-runners default zuul-trial; do k -n "$ns" delete pod farm-client --wait=false; done
          docker compose -p ci-farm down
          docker network rm farm-test
          server=/opt/arc-on-nas/manifests/tenants/build-farm/server
          k --as "$u" --as-group devinfra -n build-farm delete -k "$server" --wait=false

      - name: Zuul (test bed)
        # AIDepartment's deploy/zuul, copied into manifests/testbed-zuul by its testbed.sh (TESTBED).
        run: |
          set -euo pipefail
          k() { docker compose exec -T k3s kubectl "$@"; }
          u=opifex-magnus
          tk() { k --as "$u" --as-group devinfra -n zuul "$@"; }
          can() { k auth can-i --as "$u" --as-group devinfra "$@" 2>/dev/null || true; }
          # The tenant cannot see or change the executor's namespace (deploy/zuul/README.md, "The executor").
          for q in "-n zuul-executor get pods" "-n zuul-executor create pods" "-n zuul-executor get secrets" \
                   "-n zuul-executor patch statefulsets.apps" "-n zuul-executor get configmaps"; do
            # shellcheck disable=SC2086 # $q is the question's words
            a=$(can $q); echo "can $q: $a"; [ "$a" = no ]
          done
          # The state volumes' directories, owned by each pod's user. On a host each is a filesystem
          # of its own, bind-mounted into the node (deploy/zuul/README.md); here they are directories in
          # the node's container.
          docker compose exec -T k3s sh -c 'set -e; d=/var/lib/zuul-state
            mkdir -p "$d/zookeeper/data" "$d/db/data"
            chown 1000:1000 "$d/zookeeper/data"; chown 999:999 "$d/db/data"; chmod 700 "$d"/*/data'
          cat manifests/testbed-zuul/TESTBED
          # The namespace, its volumes and claims, by the admin.
          k apply -k /opt/arc-on-nas/manifests/testbed-zuul/namespace
          for c in zookeeper db; do k -n zuul wait --for=jsonpath='{.status.phase}'=Bound "pvc/$c" --timeout=60s; done
          # The Secrets, made by the admin (deploy/zuul/README.md, "Secrets"): the CA, the keystore
          # password, both namespaces' key pairs and the database's passwords.
          s=manifests/testbed-zuul/secrets.sh
          "$s" ca "$RUNNER_TEMP/zuul-ca"
          (umask 077 && openssl rand -hex 32 > "$RUNNER_TEMP/zuul-keystore")
          ca=(--ca-cert "$RUNNER_TEMP/zuul-ca/ca.crt" --ca-key "$RUNNER_TEMP/zuul-ca/ca.key"
              --keystore-password "$RUNNER_TEMP/zuul-keystore")
          "$s" zuul "${ca[@]}" | k -n zuul apply -f -
          "$s" db | k -n zuul apply -f -
          k apply -f /opt/arc-on-nas/manifests/testbed-zuul/executor/namespace.yaml
          "$s" executor "${ca[@]}" | k -n zuul-executor apply -f -
          # The services, applied by the tenant, as on a host; the executor by the admin.
          tk apply -k /opt/arc-on-nas/manifests/testbed-zuul/server
          k apply -k /opt/arc-on-nas/manifests/testbed-zuul/executor
          # ready: every Zuul pod is ready (the images are large: the first pull takes minutes).
          ready() {
            k -n zuul rollout status statefulset/zookeeper --timeout=600s
            k -n zuul rollout status statefulset/db --timeout=600s
            for d in scheduler web launcher; do k -n zuul rollout status "deployment/$d" --timeout=600s; done
            k -n zuul-executor rollout status statefulset/executor --timeout=600s
          }
          ready
          k -n zuul get pods -o wide
          k -n zuul-executor get pods -o wide
          # A client in zuul, and one in another namespace.
          for ns in zuul default; do
            k -n "$ns" run zuul-client --image="$CURL_IMAGE" --command -- sleep 1200
            k -n "$ns" wait --for=condition=Ready pod/zuul-client --timeout=180s
          done
          api() { k -n zuul exec zuul-client -- curl -sSf -m 10 --noproxy '*' "http://web:9000/api/$1"; }
          # retry <seconds> <command...>: until it succeeds, every 5 seconds.
          retry() {
            local end=$(( $(date +%s) + $1 )); shift
            until "$@"; do [ "$(date +%s)" -lt "$end" ] || return 1; sleep 5; done
          }
          # loaded: every service has registered and runs, and the tenant has loaded its projects.
          # zuul/zuul-jobs comes from opendev.org through the proxy, read by the executor's merger.
          loaded() {
            local got
            got=$(api components | jq -c '[.scheduler, .web, .launcher, .executor]
                  | map(length > 0 and all(.[]; .state == "running"))') || return 1
            echo "scheduler, web, launcher and executor running: $got"
            [ "$got" = '[true,true,true,true]' ] || return 1
            got=$(api tenant/aid/jobs | jq length) || return 1
            echo "the tenant's jobs: $got"; [ "$got" -gt 0 ]
          }
          retry 300 loaded
          api info | jq -c .
          api components | jq -c '.executor[] | {hostname, state, version}'
          echo "config errors: $(api tenant/aid/config-errors | jq length)"
          key=$(api tenant/aid/key/zuul/zuul-jobs.pub)
          echo "$key" | head -n 2
          grep -q 'BEGIN PUBLIC KEY' <<< "$key"

          # The network (deploy/zuul/README.md, "The network"). ZooKeeper: reached from zuul, not from
          # another namespace. connects <ns> <host:port>: a TCP connection opens within 5 seconds.
          # curl's telnet waits for the other end, so it ends at -m with an error either way; what
          # tells is whether it says it connected ("Connected to" before curl 8.13, "Established
          # connection to" since).
          connects() {
            local out
            out=$(k -n "$1" exec zuul-client -- curl -v -o /dev/null -m 5 --noproxy '*' "telnet://$2" 2>&1 || true)
            grep -qE '^\* (Connected to|Established connection to) ' <<< "$out"
          }
          expect() {
            if connects "$1" "$2"; then got=connects; else got=refused; fi
            echo "$1 -> $2: $got (want $3)"; [ "$got" = "$3" ]
          }
          zk=zookeeper.zuul.svc.cluster.local:2281
          expect zuul "$zk" connects
          expect default "$zk" refused
          # The executor's finger port: from zuul-web only, not from another pod in zuul.
          finger=$(api components | jq -r '.executor[0].hostname'):7900
          expect zuul "$finger" refused
          web=$(k -n zuul get pod -l app.kubernetes.io/name=web -o jsonpath='{.items[0].metadata.name}')
          k -n zuul exec "$web" -- python3 -c "import socket, sys
          socket.create_connection(('${finger%:*}', 7900), 5).close(); print('zuul-web -> $finger: connects')"
          # ZooKeeper takes no client without a certificate from Zuul's CA.
          k -n zuul exec "$web" -- python3 -c "import socket, ssl
          c = ssl.create_default_context(cafile='/etc/zuul-tls/ca.crt')
          try:
              s = c.wrap_socket(socket.create_connection(('zookeeper', 2281), 5), server_hostname='zookeeper')
              s.sendall(bytes(48))
              if s.recv(1):
                  raise SystemExit('ZooKeeper answered a client without a certificate')
              print('ZooKeeper without a client certificate: closed')
          except (ssl.SSLError, ConnectionResetError) as e:
              print('ZooKeeper without a client certificate:', e)"
          # The privileged executor runs in zuul-executor and nowhere else.
          priv=$(k -n zuul-executor get pod executor-0 -o jsonpath='{.spec.containers[0].securityContext.privileged}')
          echo "executor-0 privileged: $priv"; [ "$priv" = true ]

          # What persists (deploy/zuul/README.md, "What persists"): the project key in ZooKeeper and a
          # row in the database, through a restart of every Zuul pod.
          marker="arc-on-nas smoke test $(date -u +%FT%TZ)"
          # The root password from the pod's own environment, expanded there.
          # shellcheck disable=SC2016
          sql() { k -n zuul exec db-0 -- sh -c 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" -N -e "$1"' sh "$1"; }
          sql "CREATE DATABASE persist_check; CREATE TABLE persist_check.t (v VARCHAR(80));
               INSERT INTO persist_check.t VALUES ('$marker')"
          echo "Zuul's tables: $(sql 'SHOW TABLES FROM zuul' | paste -sd ' ' -)"
          docker compose exec -T k3s sh -c 'd=/var/lib/zuul-state
            ls -ln "$d/zookeeper/data/version-2"; du -sh "$d"/*/data'
          # The executor's stop is bounded whatever the order (deploy/zuul/README.md, "Stopping the
          # executor"). stops <seconds> <label>: executor-0 is deleted and a new pod replaces it within
          # <seconds>, with run.sh's lines from the old one's log.
          stops() {
            local uid now gone="" start
            uid=$(k -n zuul-executor get pod executor-0 -o jsonpath='{.metadata.uid}')
            k -n zuul-executor logs -f executor-0 > "$RUNNER_TEMP/executor-$2.log" 2>&1 &
            start=$(date +%s)
            k -n zuul-executor delete pod executor-0 --wait=false
            for _ in $(seq 1 "$1"); do
              now=$(k -n zuul-executor get pod executor-0 -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
              [ "$now" != "$uid" ] && { gone=yes; break; }
              sleep 1
            done
            sleep 2
            grep 'run.sh:' "$RUNNER_TEMP/executor-$2.log" || true
            [ -n "$gone" ] || { echo "executor-0 still running $1 s after SIGTERM ($2)" >&2; return 1; }
            echo "executor-0 stopped $2 in $(( $(date +%s) - start ))s (bound $1s)"
            k -n zuul-executor wait --for=condition=Ready pod/executor-0 --timeout=300s
          }
          # With ZooKeeper up, as for an upgrade: a graceful stop, in seconds.
          stops 60 "with ZooKeeper up"
          grep -q 'run.sh: zuul-executor exited (0)' "$RUNNER_TEMP/executor-with ZooKeeper up.log"
          retry 300 loaded
          # ZooKeeper first, as a reboot may stop them: a hard stop, within the bound.
          k -n zuul delete pod zookeeper-0 --wait=false
          sleep 2
          stops 90 "after ZooKeeper"
          grep -q 'run.sh: ZooKeeper does not answer' "$RUNNER_TEMP/executor-after ZooKeeper.log"
          k -n zuul delete pod db-0
          k -n zuul rollout restart deployment/scheduler deployment/web deployment/launcher
          for p in zuul/zookeeper-0 zuul/db-0 zuul-executor/executor-0; do
            for _ in $(seq 1 30); do k -n "${p%/*}" get pod "${p#*/}" > /dev/null 2>&1 && break; sleep 2; done
            k -n "${p%/*}" wait --for=condition=Ready "pod/${p#*/}" --timeout=300s
          done
          for d in scheduler web launcher; do k -n zuul rollout status "deployment/$d" --timeout=300s; done
          retry 300 loaded
          after=$(api tenant/aid/key/zuul/zuul-jobs.pub)
          [ "$after" = "$key" ] || { echo "the project key changed with the restart" >&2; exit 1; }
          echo "after a restart, the same project key"
          got=$(sql 'SELECT v FROM persist_check.t')
          echo "after a restart, the database's row: $got"; [ "$got" = "$marker" ]
          sql 'DROP DATABASE persist_check'
          for ns in zuul default; do k -n "$ns" delete pod zuul-client --wait=false; done

      - name: The proxy saw the pulls
        run: |
          docker compose exec -T -u proxy proxy \
            grep -cE 'CONNECT (registry-1.docker.io|ghcr.io)' /var/log/squid/access.log

      - name: The proxy's health check rotates its access log
        run: |
          set -euo pipefail
          log=/var/log/squid/access.log
          # The health check's own command, as docker-compose.yml defines it.
          check=$(docker inspect --format '{{index .Config.Healthcheck.Test 1}}' "$(docker compose ps -q proxy)")
          docker compose exec -T -u proxy proxy sh -c "yes 'padding past the rotation size' | head -c 11000000 >> $log"
          docker compose exec -T proxy sh -c "$check"
          # The rotation is a signal to Squid: wait until it has renamed the log and opened a new one.
          for _ in $(seq 1 10); do
            docker compose exec -T proxy test -e "$log.0" && docker compose exec -T proxy test -e "$log" && break
            sleep 1
          done
          old=$(docker compose exec -T proxy stat -c %s "$log.0")
          new=$(docker compose exec -T proxy stat -c %s "$log")
          echo "after the check: access.log.0 $old bytes, access.log $new bytes"
          [ "$old" -gt 10485760 ] && [ "$new" -lt 1048576 ]
          docker compose exec -T proxy squid -k check

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a || true
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -aq proxy)" || true
          docker compose logs --tail 200 k3s || true
          docker compose exec -T k3s kubectl get pods -A -o wide || true
          docker compose exec -T k3s kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          docker compose exec -T k3s kubectl -n arc-systems describe pods || true
          for ns in zuul zuul-executor; do
            docker compose exec -T k3s kubectl -n "$ns" describe pods || true
            for p in $(docker compose exec -T k3s kubectl -n "$ns" get pods -o name 2>/dev/null); do
              docker compose exec -T k3s kubectl -n "$ns" logs --tail 80 --all-containers "$p" || true
            done
          done
          docker compose exec -T -u proxy proxy tail -n 60 /var/log/squid/access.log || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --timeout 30 || true
          sudo rm -rf kubeconfig "$RUNNER_TEMP/ci-cache" .env
